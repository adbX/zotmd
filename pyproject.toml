[project]
name = "zotmd"
version = "0.5.1"
description = "Sync Zotero notes and discover already-local papers through a typed API"
readme = "README.md"
authors = [
    { name = "Adhithya Bhaskar", email = "adhithyabhaskar@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["zotero", "obsidian", "markdown", "python", "pdf-annotations"]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "alive-progress>=3.3.0",
    "click>=8.5.0",
    "httpx2>=2.12.0,<3",
    "jinja2>=3.1.6",
    "platformdirs>=4.11.8",
    "pyyaml>=6.0.3",
    "pyzotero>=1.15.1,<2",
    "tomli-w>=1.2.0",
]

[project.scripts]
zotmd = "zotmd.cli:main"

[project.urls]
Documentation = "https://adbx.github.io/zotmd/"
Issues = "https://github.com/adbX/zotmd/issues"
Source = "https://github.com/adbX/zotmd"

[build-system]
requires = ["hatchling>=1.32.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    "/.cache",
    "/.claude",
    "/.mypy_cache",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.rumdl_cache",
    "/.venv",
    "/dev",
    "/dist",
    "/references",
    "/site",
    "*.sqlite",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zotmd"]

[tool.hatch.build.targets.sdist]
include = [
    "/.rumdl.toml",
    "/CHANGELOG.md",
    "/docs",
    "/LICENSE",
    "/README.md",
    "/ROADMAP.md",
    "/SECURITY.md",
    "/tests",
    "/pyproject.toml",
    "/src",
    "/tools",
    "/uv.lock",
    "/zensical.toml",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
    "rumdl>=0.2.63",
]
docs = [
    "zensical>=0.0.58",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["alive_progress", "pyzotero"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["zotmd"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
